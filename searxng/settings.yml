# SearXNG settings - place in ./searxng/ directory before running docker-compose
# This file enables JSON output format for the API

use_default_settings: true
general:
  debug: false
  instance_name: "MECOS SearXNG"

search:
  formats:
    - html
    - json

server:
  secret_key: "change-me-to-a-random-string"
  base_url: http://localhost:8888/

# Optional: restrict to specific engines to reduce load
engines:
  - name: google
    engine: google
    shortcut: g
    categories: general
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: general
